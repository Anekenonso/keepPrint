<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39159" />
      <stop offset="100%" stop-color="#e0753a" />
    </linearGradient>
    <linearGradient id="logoLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c45c26" />
      <stop offset="100%" stop-color="#a64617" />
    </linearGradient>
    <linearGradient id="logoRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e3810" />
      <stop offset="100%" stop-color="#642407" />
    </linearGradient>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c241f" />
      <stop offset="100%" stop-color="#191412" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#logoBg)" stroke="#e5ded6" stroke-width="1.5" stroke-opacity="0.3" />
    <!-- Calibration bed ring -->
    <ellipse cx="32" cy="50" rx="20" ry="6" fill="none" stroke="#e0753a" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="2 3" />
    <!-- Isometric Facets -->
    <polygon points="32,13 49,22 32,31 15,22" fill="url(#logoTop)" />
    <polygon points="15,22 32,31 32,49 15,40" fill="url(#logoLeft)" />
    <polygon points="32,31 49,22 49,40 32,49" fill="url(#logoRight)" />
    <!-- 3D Print Layer Lines -->
    <path d="M 15 28 L 32 37 L 49 28" fill="none" stroke="#f8f4ef" stroke-width="1.2" stroke-opacity="0.75" />
    <path d="M 15 34 L 32 43 L 49 34" fill="none" stroke="#f8f4ef" stroke-width="1.2" stroke-opacity="0.75" />
    <!-- Origin vertex -->
    <circle cx="32" cy="13" r="2" fill="#fff" />
  </g>

  <!-- Typography -->
  <text x="88" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#c45c26" letter-spacing="-0.5">Keepprint</text>
  <text x="89" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#6b5e54" letter-spacing="0.2">Preserve original · Print tangible</text>
</svg>
