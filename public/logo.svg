<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 92" width="380" height="92">
  <defs>
    <!-- Soft Drop Shadow for Mark Container -->
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1a1613" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(10, 8)" filter="url(#markShadow)">
    <!-- Architectural Tile Base -->
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#ffffff" stroke="#e4ddd2" stroke-width="1.5" />
    <rect x="2.5" y="2.5" width="71" height="71" rx="15.5" fill="#fdfbf7" />

    <!-- 3D Print Build Platform Base -->
    <ellipse cx="38" cy="63" rx="24" ry="5.5" fill="#ba5322" fill-opacity="0.08" stroke="#ba5322" stroke-width="1.2" stroke-dasharray="2 3" />

    <!-- Preservation Vertical Pillar (The Original Safe) -->
    <rect x="19" y="15" width="8.5" height="46" rx="4.25" fill="#1a1613" />

    <!-- Upper Strata Layer (Amber 3D Tier) -->
    <path d="M 33.5 18 L 56 18 C 57.5 18 58.8 19.5 58 21 L 52 29.5 L 33.5 29.5 Z" fill="#e0753a" />

    <!-- Middle Slicer Transition Layer (Terracotta Tier) -->
    <path d="M 33.5 31.5 L 50 31.5 L 44 40 L 33.5 40 Z" fill="#ba5322" />

    <!-- Lower Cantilever Print Layer (Heritage Bronze Tier) -->
    <path d="M 33.5 42 L 42 42 L 53.5 58 C 54.5 59.3 53.5 61 51.8 61 L 40.5 61 Z" fill="#8e3810" />

    <!-- Additive Slicer Horizontal Lines -->
    <line x1="35" y1="23.5" x2="55" y2="23.5" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
    <line x1="35" y1="35.5" x2="47" y2="35.5" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
    <line x1="35" y1="50" x2="46" y2="50" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />

    <!-- Top Origin Alignment Pip -->
    <circle cx="23.25" cy="19.25" r="1.8" fill="#e0753a" />
  </g>

  <!-- Typography -->
  <text x="104" y="47" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#1a1613" letter-spacing="-0.8">Keep<tspan fill="#ba5322">print</tspan></text>
  <text x="105" y="69" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#6e6256" letter-spacing="0.1">Keep the original safe · Print a copy you can hold</text>
</svg>
