<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #1F1A17; fill-opacity: 0.7; }
      .dialog-bg { fill: #FFFFFF; rx: 16px; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.3)); }
      .badge { fill: #FBF0E8; rx: 4px; }
      .badge-text { fill: #C45C26; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; }
      .title { fill: #1F1A17; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 700; }
      .subtitle { fill: #6B5E54; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
      .card-bg { fill: #FAF7F2; stroke: #E8DFD5; stroke-width: 1; rx: 12px; }
      .card-title { fill: #1F1A17; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; }
      .card-body { fill: #6B5E54; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; line-height: 1.4; }
      .note-bg { fill: #F0F7F3; stroke: #D2EADB; stroke-width: 1; rx: 10px; }
      .note-text { fill: #1F1A17; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
      .btn { fill: #C45C26; rx: 8px; cursor: pointer; }
      .btn-text { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Darkened Backdrop -->
  <rect width="1200" height="800" class="bg" />

  <!-- Modal Dialog Container -->
  <g transform="translate(240, 80)">
    <rect width="720" height="640" class="dialog-bg" />

    <!-- Header -->
    <rect x="40" y="32" width="130" height="24" class="badge" />
    <text x="50" y="48" class="badge-text">3D PRINT GUIDE</text>
    <text x="40" y="86" class="title">How to Slice &amp; Print Your Heirloom</text>
    <text x="40" y="112" class="subtitle">Practical slicer settings to ensure your replica looks, feels, and endures.</text>

    <!-- Close button (X) -->
    <text x="660" y="52" fill="#6B5E54" font-size="22" font-family="sans-serif" cursor="pointer">✕</text>

    <!-- Grid of 4 Cards -->
    <!-- Card 1: Orientation -->
    <g transform="translate(40, 140)">
      <rect width="305" height="175" class="card-bg" />
      <text x="16" y="32" class="card-title">📐 1. Slicer &amp; Orientation</text>
      <text x="16" y="58" class="card-body">Open PrusaSlicer, Bambu Studio, or Cura.</text>
      <text x="16" y="80" class="card-body">• Rotate model so flattest base sits on bed.</text>
      <text x="16" y="102" class="card-body">• Avoid horizontal layer lines on thin stems.</text>
      <text x="16" y="124" class="card-body">• Use 0.12–0.16mm layer height for details.</text>
    </g>

    <!-- Card 2: Infill & Wall Strength -->
    <g transform="translate(375, 140)">
      <rect width="305" height="175" class="card-bg" />
      <text x="16" y="32" class="card-title">🧱 2. Infill &amp; Wall Strength</text>
      <text x="16" y="58" class="card-body">Heirlooms need real physical weight:</text>
      <text x="16" y="80" class="card-body">• 15%–20% Gyroid or Grid infill.</text>
      <text x="16" y="102" class="card-body">• 3 to 4 perimeter walls (~1.4mm thickness).</text>
      <text x="16" y="124" class="card-body">• Solid hand feel prevents hollow resonance.</text>
    </g>

    <!-- Card 3: Organic Supports -->
    <g transform="translate(40, 335)">
      <rect width="305" height="175" class="card-bg" />
      <text x="16" y="32" class="card-title">🌳 3. Organic / Tree Supports</text>
      <text x="16" y="58" class="card-body">Protect delicate heirloom carvings:</text>
      <text x="16" y="80" class="card-body">• Enable Tree / Organic supports.</text>
      <text x="16" y="102" class="card-body">• 45°–50° overhang angle threshold.</text>
      <text x="16" y="124" class="card-body">• Peels away cleanly with zero surface scarring.</text>
    </g>

    <!-- Card 4: Materials -->
    <g transform="translate(375, 335)">
      <rect width="305" height="175" class="card-bg" />
      <text x="16" y="32" class="card-title">✨ 4. Material &amp; Finishing</text>
      <text x="16" y="58" class="card-body">Match material to heirloom heritage:</text>
      <text x="16" y="80" class="card-body">• Wood Carvings: Wood-filled PLA (stainable).</text>
      <text x="16" y="102" class="card-body">• Ceramics: Matte PLA or Marble PLA.</text>
      <text x="16" y="124" class="card-body">• Metal/Jewelry: Silk Bronze PLA or SLA resin.</text>
    </g>

    <!-- Preservation Banner -->
    <g transform="translate(40, 525)">
      <rect width="640" height="42" class="note-bg" />
      <text x="16" y="26" class="note-text">🛡️ Heirloom Preservation: The replica travels; the original stays safe.</text>
    </g>

    <!-- Footer Action -->
    <g transform="translate(490, 580)">
      <rect width="190" height="42" class="btn" />
      <text x="95" y="26" class="btn-text">Got it, Close Guide</text>
    </g>
  </g>
</svg>

