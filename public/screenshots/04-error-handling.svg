<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <style>
      .bg { fill: #F8F4EF; }
      .card { fill: #FFFFFF; stroke: #E5DED6; stroke-width: 1.5; rx: 12px; }
      .header-title { font-family: system-ui, sans-serif; font-size: 32px; font-weight: bold; fill: #C45C26; text-anchor: middle; }
      .header-sub { font-family: system-ui, sans-serif; font-size: 18px; fill: #6B5E54; text-anchor: middle; }
      .error-card { fill: #FDF2F2; stroke: #B33A3A; stroke-width: 1.5; rx: 12px; }
      .error-title { font-family: system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #B33A3A; text-anchor: middle; }
      .error-msg { font-family: system-ui, sans-serif; font-size: 16px; fill: #1F1A17; text-anchor: middle; }
      .error-hint { font-family: system-ui, sans-serif; font-size: 14px; fill: #6B5E54; text-anchor: middle; }
      .retry-btn { fill: #C45C26; rx: 10px; }
      .retry-text { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="650" class="bg" />

  <!-- Header -->
  <text x="600" y="80" class="header-title">Keepprint</text>
  <text x="600" y="115" class="header-sub">Keep the original safe. Print a copy you can hold.</text>

  <!-- Card Container -->
  <rect x="250" y="150" width="700" height="420" class="card" />

  <!-- Error Card Box -->
  <rect x="290" y="190" width="620" height="260" class="error-card" />
  <text x="600" y="245" font-size="36" text-anchor="middle">⚠️</text>
  <text x="600" y="295" class="error-title">Generation Paused</text>
  <text x="600" y="335" class="error-msg">3D generation could not be completed for this heirloom.</text>
  <text x="600" y="365" class="error-hint">Please verify your input or check network connectivity.</text>

  <!-- Retry Button -->
  <rect x="500" y="390" width="200" height="44" class="retry-btn" />
  <text x="600" y="418" class="retry-text">Try Again</text>
</svg>

