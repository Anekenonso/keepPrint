<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39159" />
      <stop offset="100%" stop-color="#e0753a" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c45c26" />
      <stop offset="100%" stop-color="#a64617" />
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e3810" />
      <stop offset="100%" stop-color="#642407" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c241f" />
      <stop offset="100%" stop-color="#191412" />
    </linearGradient>
  </defs>

  <!-- App Icon Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#e5ded6" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- 3D Print Layer Calibration Base Ring -->
  <ellipse cx="32" cy="50" rx="20" ry="6" fill="none" stroke="#e0753a" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="2 3" />

  <!-- Isometric 3D Heirloom Form -->
  <!-- Top Facet -->
  <polygon points="32,13 49,22 32,31 15,22" fill="url(#facetTop)" />

  <!-- Left Facet -->
  <polygon points="15,22 32,31 32,49 15,40" fill="url(#facetLeft)" />

  <!-- Right Facet -->
  <polygon points="32,31 49,22 49,40 32,49" fill="url(#facetRight)" />

  <!-- Sliced 3D Print Layer Lines (Additive manufacturing motif) -->
  <path d="M 15 28 L 32 37 L 49 28" fill="none" stroke="#f8f4ef" stroke-width="1.2" stroke-opacity="0.75" />
  <path d="M 15 34 L 32 43 L 49 34" fill="none" stroke="#f8f4ef" stroke-width="1.2" stroke-opacity="0.75" />

  <!-- Center Nozzle / Preservation Point -->
  <circle cx="32" cy="13" r="2" fill="#fff" />
</svg>
