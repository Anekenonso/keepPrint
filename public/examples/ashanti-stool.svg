<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" aria-label="Ashanti Carved Wooden Heirloom Stool">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff9f4" />
      <stop offset="100%" stop-color="#ecd9c9" />
    </radialGradient>
    <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2110" />
      <stop offset="50%" stop-color="#67311a" />
      <stop offset="100%" stop-color="#3d1b0d" />
    </linearGradient>
    <linearGradient id="woodMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#914925" />
      <stop offset="40%" stop-color="#7a3a1b" />
      <stop offset="100%" stop-color="#552410" />
    </linearGradient>
    <linearGradient id="woodHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b05829" />
      <stop offset="50%" stop-color="#c96d39" />
      <stop offset="100%" stop-color="#914925" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2a1409" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Ground Drop Shadow -->
  <ellipse cx="200" cy="255" rx="140" ry="18" fill="#3a1e12" opacity="0.2" filter="blur(6px)" />

  <!-- Stool Group -->
  <g filter="url(#shadow)">
    <!-- Stepped Base - Bottom tier -->
    <rect x="70" y="225" width="260" height="18" rx="5" fill="url(#woodDark)" />
    <rect x="75" y="225" width="250" height="4" rx="2" fill="url(#woodHighlight)" opacity="0.6" />

    <!-- Stepped Base - Second tier -->
    <rect x="90" y="208" width="220" height="18" rx="4" fill="url(#woodMid)" />
    <rect x="95" y="208" width="210" height="3" rx="1.5" fill="url(#woodHighlight)" opacity="0.7" />

    <!-- Central Pillar / Openwork Structure -->
    <!-- Center solid column -->
    <rect x="175" y="105" width="50" height="104" rx="6" fill="url(#woodDark)" />
    <!-- Intricate openwork cutouts (traditional Ashanti geometric pierced reliefs) -->
    <rect x="185" y="118" width="30" height="20" rx="3" fill="#ecd9c9" opacity="0.9" />
    <polygon points="200,146 185,164 215,164" fill="#ecd9c9" opacity="0.9" />
    <polygon points="200,192 185,174 215,174" fill="#ecd9c9" opacity="0.9" />

    <!-- Four Outer Support Pillars (Carved curved caryatid struts) -->
    <!-- Left Outer Strut -->
    <path d="M 105,108 C 105,135 125,185 125,208 L 138,208 C 138,185 120,135 120,108 Z" fill="url(#woodMid)" />
    <!-- Left Inner Strut -->
    <path d="M 145,108 C 145,140 152,180 152,208 L 163,208 C 163,180 156,140 156,108 Z" fill="url(#woodDark)" />
    <!-- Right Inner Strut -->
    <path d="M 237,108 C 237,140 244,180 244,208 L 255,208 C 255,180 248,140 248,108 Z" fill="url(#woodDark)" />
    <!-- Right Outer Strut -->
    <path d="M 280,108 C 280,135 262,185 262,208 L 275,208 C 275,185 295,135 295,108 Z" fill="url(#woodMid)" />

    <!-- Crescent Curved Seat (Golden ratio curved top typical of Kumasi stools) -->
    <path d="M 50,75 C 110,110 290,110 350,75 C 330,115 270,122 200,122 C 130,122 70,115 50,75 Z" fill="url(#woodMid)" />
    <!-- Seat Rim Highlight -->
    <path d="M 50,75 C 110,110 290,110 350,75 C 342,80 286,115 200,115 C 114,115 58,80 50,75 Z" fill="url(#woodHighlight)" />
    <!-- Seat Upper Bevel -->
    <path d="M 52,73 C 112,107 288,107 348,73 C 352,76 348,79 344,81 C 286,113 114,113 56,81 C 52,79 48,76 52,73 Z" fill="#d97f48" opacity="0.8" />
  </g>

  <!-- Specular highlights & subtle carving notches -->
  <line x1="80" y1="210" x2="320" y2="210" stroke="#f3a473" stroke-width="1" opacity="0.4" />
  <line x1="60" y1="227" x2="340" y2="227" stroke="#f3a473" stroke-width="1" opacity="0.3" />
</svg>
