<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" aria-label="Grandfather's Brass Maritime Compass">
  <defs>
    <radialGradient id="compassBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fffbf2" />
      <stop offset="100%" stop-color="#e8dec8" />
    </radialGradient>
    <radialGradient id="brassCasing" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="35%" stop-color="#d4a342" />
      <stop offset="70%" stop-color="#946517" />
      <stop offset="100%" stop-color="#593b0b" />
    </radialGradient>
    <radialGradient id="dialFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfcf9" />
      <stop offset="75%" stop-color="#f2ede0" />
      <stop offset="100%" stop-color="#ded4be" />
    </radialGradient>
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#9d0208" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d405b" />
      <stop offset="100%" stop-color="#1d2d44" />
    </linearGradient>
    <filter id="compassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#3a2507" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" fill="url(#compassBg)" rx="16" />

  <!-- Ground Drop Shadow -->
  <ellipse cx="200" cy="250" rx="130" ry="20" fill="#2d1c07" opacity="0.25" filter="blur(8px)" />

  <g filter="url(#compassShadow)">
    <!-- Top Hanging Loop / Ring -->
    <path d="M 180,45 C 180,25 220,25 220,45" fill="none" stroke="url(#brassCasing)" stroke-width="12" stroke-linecap="round" />
    <circle cx="200" cy="46" r="6" fill="#f5d77f" />

    <!-- Hinged Lid open backwards (3D perspective slant) -->
    <ellipse cx="200" cy="65" rx="85" ry="22" fill="url(#brassCasing)" />
    <ellipse cx="200" cy="65" rx="78" ry="18" fill="#593b0b" opacity="0.7" />

    <!-- Main Outer Brass Casing (Milled Coin-Edge Outer Rim) -->
    <circle cx="200" cy="165" r="95" fill="url(#brassCasing)" />
    <circle cx="200" cy="165" r="92" fill="none" stroke="#ffe599" stroke-width="2" opacity="0.8" />
    <circle cx="200" cy="165" r="88" fill="#7a5213" />

    <!-- Bezel & Glass Crystal Reflection -->
    <circle cx="200" cy="165" r="82" fill="url(#dialFace)" stroke="#4a3007" stroke-width="3" />

    <!-- Degree Ticks -->
    <circle cx="200" cy="165" r="76" fill="none" stroke="#7a5e37" stroke-width="1.5" stroke-dasharray="2 4" />
    <circle cx="200" cy="165" r="72" fill="none" stroke="#2b2318" stroke-width="1" />

    <!-- Cardinal Directions -->
    <text x="200" y="112" font-family="serif" font-size="14" font-weight="bold" fill="#b71c1c" text-anchor="middle">N</text>
    <text x="200" y="230" font-family="serif" font-size="12" font-weight="bold" fill="#2b2318" text-anchor="middle">S</text>
    <text x="258" y="170" font-family="serif" font-size="12" font-weight="bold" fill="#2b2318" text-anchor="middle">E</text>
    <text x="142" y="170" font-family="serif" font-size="12" font-weight="bold" fill="#2b2318" text-anchor="middle">W</text>

    <!-- Compass Rose Star (Subtle) -->
    <polygon points="200,120 206,160 200,165 194,160" fill="#d4a342" opacity="0.6" />
    <polygon points="200,210 206,170 200,165 194,170" fill="#a67c2e" opacity="0.6" />
    <polygon points="245,165 205,171 200,165 205,159" fill="#d4a342" opacity="0.6" />
    <polygon points="155,165 195,171 200,165 195,159" fill="#a67c2e" opacity="0.6" />

    <!-- Magnetic Needle -->
    <!-- North Arrow (Red) -->
    <polygon points="200,165 193,165 200,118 207,165" fill="url(#needleNorth)" />
    <polygon points="200,165 200,118 207,165" fill="#e63946" />
    <!-- South Arrow (Navy/Gunmetal) -->
    <polygon points="200,165 193,165 200,212 207,165" fill="url(#needleSouth)" />
    <polygon points="200,165 200,212 207,165" fill="#457b9d" />

    <!-- Center Brass Pivot Cap -->
    <circle cx="200" cy="165" r="8" fill="url(#brassCasing)" stroke="#3a2507" stroke-width="1.5" />
    <circle cx="198" cy="163" r="2.5" fill="#fff" opacity="0.8" />

    <!-- Glass Crystal Arc Highlight -->
    <path d="M 130,140 A 75 75 0 0 1 230,105" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
